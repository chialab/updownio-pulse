name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! 🐛
        **Please redact your pulse URL** (use `xxxx/YYYYYYYY`): anyone who knows it can send pulses on your behalf.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `updownio-pulse --version`
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, and whether you run it in Docker
      placeholder: linux/arm64 in Docker
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The full command line you ran (pulse URL redacted)
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exit code and any `updownio-pulse:` messages on stderr.
    validations:
      required: true
